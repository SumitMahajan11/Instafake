services:
  - type: web
    name: reelclaim-backend
    runtime: python
    region: oregon
    buildCommand: cd reelclaim-backend && pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: cd reelclaim-backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 120
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: REQUIRE_AUTH
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: reelclaim-db
          property: connectionString

databases:
  - name: reelclaim-db
    plan: free
    region: oregon
